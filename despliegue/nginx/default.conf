# Punto de entrada único (CLAUDE.md §5.3): el front y la API salen del mismo origen, por eso no hay CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con una variable en proxy_pass, nginx busca el servicio en cada petición:
    # así arranca aunque un microservicio todavía no exista o se esté reiniciando (responde 502 mientras tanto).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sin ruta después del puerto: se reenvía /api/v1/... tal cual
    location /api/v1/auth/      { set $usuarios http://ms-usuarios:8081; proxy_pass $usuarios; }
    location /api/v1/usuarios   { set $usuarios http://ms-usuarios:8081; proxy_pass $usuarios; }
    location /api/v1/productos  { set $catalogo http://ms-catalogo:8082; proxy_pass $catalogo; }
    location /api/v1/categorias { set $catalogo http://ms-catalogo:8082; proxy_pass $catalogo; }
    location /api/v1/boletas    { set $ventas   http://ms-ventas:8083;   proxy_pass $ventas; }

    # Cualquier otra ruta de la API, incluida /api/v1/interno (solo ms-ventas → ms-catalogo por la red
    # interna), no se publica. Sin este bloque caería en el front y respondería index.html con 200.
    location /api/ {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","mensaje":"Ruta no encontrada"}';
    }

    # Archivos del build de Vite: llevan un hash en el nombre, se pueden guardar en caché mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de React (/catalogo, /admin/productos...): si no es un archivo, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
